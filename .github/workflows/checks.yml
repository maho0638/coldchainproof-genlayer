name: Simple contract checks

on:
  push:
    paths:
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q contracts tests
      - run: python -m pytest -q tests
